<style>
/* Layout: one-screen app. A CET answer-sheet card on a stage that heats up from exam paper to party; keyboard docked at the bottom.
   Single deliberate look (answer-sheet white + print red + 2B graphite). */
:root {
  --paper: #FBFBF8;
  --ink: #25232C;
  --ink-soft: #6C6875;
  --sheet: #D6443A;
  --sheet-tint: #F7DCD8;
  --pencil: #F2B229;
  --miss: #7A4CD9;
  --miss-tint: #EEE6FC;
  --ok: #168C62;
  --line: #E8E3E0;
  --key: #FFFFFF;
  --key-edge: #D9D3CF;
  --stage-bg: var(--paper);
  --hud-fg: var(--ink);
  --font-display: 'Bungee', 'Arial Black', system-ui, sans-serif;
  --font-hand: 'Shantell Sans', 'Chalkboard SE', 'Comic Sans MS', system-ui, sans-serif;
  --font-cn: 'ZCOOL KuaiLe', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--miss); outline-offset: 2px; }
#app { height: 100%; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; overscroll-behavior: contain; }
.wrap { width: 100%; max-width: 480px; margin: 0 auto; padding-inline: 16px; box-sizing: border-box; }
.grid-paper {
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent 0 27px, var(--sheet-tint) 27px 28px),
    repeating-linear-gradient(90deg, transparent 0 27px, var(--sheet-tint) 27px 28px);
  background-position: -1px -1px;
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: 2px solid var(--ink); background: var(--key); border-radius: 12px; padding: 12px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; touch-action: manipulation; box-sizing: border-box; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--sheet); color: #fff; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 10px; color: var(--hud-fg); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- home ---------- */
#scr-home .wrap { display: flex; flex-direction: column; gap: 16px; padding-block: 24px 20px; min-height: 100%; box-sizing: border-box; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; color: var(--sheet); }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero h1 { margin: 6px 0 0; font-family: var(--font-cn); font-weight: 400; font-size: clamp(46px, 14vw, 64px); line-height: 1; }
.hero .hook { margin: 12px 0 0; font-size: 16px; font-weight: 700; line-height: 1.5; text-wrap: balance; }
.hero .mascot-wrap { width: 70px; flex: none; margin-bottom: -4px; }
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 6px 0 var(--ink); }
.card h2 { margin: 0; font-family: var(--font-cn); font-weight: 400; font-size: 24px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h2 small { font-family: var(--font-display); font-size: 12px; color: var(--sheet); letter-spacing: .06em; }
.card p { margin: 0; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
.card p b { color: var(--ink); }
.card .big { font-size: 20px; padding: 15px; font-family: var(--font-cn); font-weight: 400; letter-spacing: .06em; }
.card.vs { border-color: var(--sheet); box-shadow: 0 6px 0 var(--sheet); background: #FFF4F2; }
.card.vs .num { font-family: var(--font-display); font-size: 40px; color: var(--sheet); line-height: 1; }
.done-row { display: flex; align-items: center; gap: 14px; }
.done-row .score { font-family: var(--font-display); font-size: 46px; line-height: 1; color: var(--sheet); font-variant-numeric: tabular-nums; }
.done-row .score small { font-size: 16px; color: var(--ink-soft); }
.done-row .meta { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.done-row .meta b { color: var(--ink); font-family: var(--font-cn); font-weight: 400; font-size: 18px; }
.emoji-grid { font-size: 18px; letter-spacing: 1px; line-height: 1.2; white-space: nowrap; }
.countdown { font-family: var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--ink-soft); line-height: 1.6; background: var(--paper); padding-top: 6px; }
.foot button { border: 0; background: none; padding: 4px 0; font-size: 12px; color: var(--ink); text-decoration: underline; }
.foot p { margin: 0; width: 100%; }

/* ---------- play ---------- */
#scr-play { background: var(--stage-bg); transition: background-color 1.2s; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.hud { width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--hud-fg); transition: color 1s; }
.prog { flex: 1; min-width: 0; display: grid; gap: 4px; }
.prog span { font-family: var(--font-display); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--hud-fg) 15%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sheet); border-radius: 3px; transition: width .3s; }
.dopa { text-align: right; line-height: 1.05; }
.dopa small { display: block; font-size: 10px; opacity: .7; letter-spacing: .1em; }
.dopa b { font-family: var(--font-display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; display: inline-block; }
.dopa b.bump { animation: bump .25s; }
.clock { font-family: var(--font-display); font-size: 15px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.clock.warn { color: var(--sheet); animation: pulse .5s infinite alternate; }
.stage { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 4px 16px 10px; gap: 10px; }
.combo { align-self: center; display: flex; align-items: baseline; gap: 6px; color: var(--hud-fg); height: 40px; opacity: 0; transition: opacity .2s; }
.combo.on { opacity: 1; }
.combo b { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; }
.combo span { font-family: var(--font-cn); font-size: 16px; }
.combo .mult { font-family: var(--font-display); font-style: normal; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--pencil); color: var(--ink); }
.cbar { width: 60px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--hud-fg) 18%, transparent); overflow: hidden; align-self: center; }
.cbar i { display: block; height: 100%; width: 100%; background: var(--pencil); }
.cbar.low i { background: var(--sheet); }
.sheet { position: relative; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; background: var(--paper); border: 2px solid var(--sheet); border-radius: 6px; padding: 12px 14px 14px; box-shadow: 0 10px 30px rgba(37, 35, 44, .12); display: grid; gap: 10px; transform: scale(var(--beat, 1)); transition: transform .12s ease-out; }
.sheet::before { content: ''; position: absolute; inset: 4px; border: 1px dashed var(--sheet-tint); border-radius: 3px; pointer-events: none; }
.sheet.shake { animation: shake .35s; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sheet); letter-spacing: .08em; font-weight: 700; padding-right: 46px; }
.sheet-head .qnode { color: var(--ink-soft); font-weight: 500; letter-spacing: 0; }
.prompt { display: flex; align-items: flex-start; gap: 10px; }
.speak { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink); background: var(--pencil); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); touch-action: manipulation; }
.speak:active { transform: translateY(3px); box-shadow: none; }
.speak svg { width: 22px; height: 22px; }
.speak.talking { animation: pulse .6s infinite alternate; }
.meaning { margin: 0; font-size: 19px; line-height: 1.45; min-width: 0; font-weight: 600; min-height: 28px; }
.meaning .pos { display: inline-block; font-family: var(--font-hand); font-size: 13px; font-weight: 700; color: var(--sheet); border: 1.5px solid var(--sheet); border-radius: 5px; padding: 0 5px; margin-right: 5px; line-height: 1.4; vertical-align: 2px; }
.meaning .sense { margin-right: 10px; }
.slots { display: flex; justify-content: center; flex-wrap: nowrap; gap: var(--gap, 5px); padding-block: 6px 2px; min-height: 54px; }
.slot { --s: 44px; width: var(--s); height: calc(var(--s) * 1.2); box-sizing: border-box; border: 1.5px solid var(--sheet); border-radius: 3px; display: grid; place-items: center; font-family: var(--font-hand); font-weight: 700; font-size: calc(var(--s) * .66); line-height: 1; color: var(--ink); background: var(--paper); position: relative; flex: none; }
.slot.fixed { border-color: transparent; color: var(--ink-soft); }
.slot.cur { border-width: 2.5px; background: #FFF8E6; }
.slot.cur::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: 12%; height: 3px; border-radius: 2px; background: var(--ink); animation: caret 1s steps(2) infinite; }
.slot.ok { animation: pop .22s ease-out; }
.slot.miss { border: 2px dashed var(--miss); color: var(--miss); background: var(--miss-tint); }
.slot.miss::after { display: none; }
.slot.ghost .g { color: color-mix(in srgb, var(--ink) 28%, transparent); }
.slot.was-miss { background: var(--miss-tint); }
.slot.hl { box-shadow: 0 0 0 4px color-mix(in srgb, var(--miss) 35%, transparent); }
.sheet.done .slot:not(.fixed) { border-color: var(--ok); color: var(--ok); }
.hint { margin: 0; min-height: 20px; font-size: 14px; color: var(--ink-soft); text-align: center; }
.hint .ph { font-family: var(--font-hand); font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.hint.miss { color: var(--miss); font-weight: 700; }
.mascot { position: absolute; right: 6px; top: -46px; width: 48px; pointer-events: none; }
.mascot-wrap svg, .mascot svg { width: 100%; height: auto; display: block; overflow: visible; }
.pp { transform-origin: 50% 90%; animation: bob 2.4s ease-in-out infinite; }
.pp .mo { display: none; }
.pp .mo-n { display: block; }
.pp.happy { animation: hop .5s ease-out; }
.pp.happy .mo-n, .pp.sad .mo-n { display: none; }
.pp.happy .mo-h { display: block !important; }
.pp.sad { animation: no .45s; }
.pp.sad .mo-s { display: block !important; }
.pp.dance { animation: sway var(--beat-dur, 1.1s) ease-in-out infinite alternate; }
.pp .eyes { transform-origin: 40px 64px; animation: blink 4s infinite; }
.kb { position: relative; z-index: 2; display: grid; gap: 7px; padding: 8px 6px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--paper) 82%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.kb-row { display: flex; justify-content: center; gap: 5px; }
.key { flex: 1 1 0; max-width: 46px; height: 50px; border-radius: 8px; border: 1.5px solid var(--key-edge); background: var(--key); box-shadow: 0 2px 0 var(--key-edge); font-family: var(--font-hand); font-weight: 700; font-size: 21px; color: var(--ink); padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.key.wide { max-width: 64px; flex-grow: 1.5; display: grid; place-items: center; }
.key.wide svg { width: 22px; height: 22px; }
.key.down { transform: translateY(2px); box-shadow: none; background: var(--pencil); }
.key.bad { background: var(--miss-tint); }
.flashword { position: absolute; z-index: 3; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: clamp(28px, 9vw, 54px); color: var(--sheet); pointer-events: none; white-space: nowrap; text-shadow: 3px 3px 0 var(--paper), -3px 3px 0 var(--paper), 3px -3px 0 var(--paper), -3px -3px 0 var(--paper); animation: banner 1.4s ease-out forwards; }
.flashword small { display: block; text-align: center; font-family: var(--font-cn); font-size: .42em; color: var(--ink); }

#app[data-stage="1"] { --stage-bg: #FFF6EC; }
#app[data-stage="2"] { --stage-bg: #FFE9DF; }
#app[data-stage="3"] { --stage-bg: #FFDCE8; }
#app[data-stage="4"] { --stage-bg: #EAD9FF; }
#app[data-stage="5"] { --stage-bg: #3B2477; --hud-fg: #FFF4D6; }
#app[data-stage="6"] { --stage-bg: #24134A; --hud-fg: #FFF4D6; }
#app[data-stage="7"] { --stage-bg: #140B2C; --hud-fg: #FFF4D6; }

/* ---------- result ---------- */
.page { display: flex; flex-direction: column; height: 100%; }
.page-body { flex: 1; min-height: 0; }
.page-body .wrap { padding-block: 16px 24px; display: grid; gap: 14px; }
.page-foot { display: flex; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--paper); justify-content: center; }
.page-foot .btn { flex: 1 1 0; max-width: 220px; padding-inline: 8px; }
.res-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.res-head h2 { margin: 0; font-family: var(--font-cn); font-weight: 400; font-size: 24px; }
.res-head span { font-size: 13px; color: var(--ink-soft); }
.shot { width: 100%; aspect-ratio: 4 / 5; border-radius: 12px; border: 1.5px solid var(--line); box-shadow: 0 8px 24px rgba(37, 35, 44, .12); background: var(--paper); display: block; max-width: 100%; }
.share { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.share .btn { padding: 12px 6px; font-size: 15px; }
.share-tip { font-size: 12px; color: var(--ink-soft); text-align: center; margin: -4px 0 0; }
.verdict { text-align: center; font-size: 15px; font-weight: 700; padding: 10px; border-radius: 10px; background: #FFF5D9; border: 1.5px solid var(--pencil); line-height: 1.5; }
.section-title { font-size: 12px; letter-spacing: .1em; color: var(--sheet); font-weight: 700; margin: 6px 0 -6px; }
.wlist { display: grid; border-top: 1px solid var(--line); }
.witem { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.witem .w { font-family: var(--font-hand); font-weight: 700; font-size: 18px; }
.witem .m { font-size: 13px; color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.witem .r { font-size: 12px; font-weight: 700; color: var(--ok); white-space: nowrap; }
.witem .r.x { color: var(--miss); }
.witem .r.n { color: var(--ink-soft); }
.witem .w mark { background: var(--miss-tint); color: var(--miss); border-radius: 2px; }
.toast { position: absolute; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; white-space: nowrap; }

/* ---------- overlay ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; background: rgba(37, 35, 44, .45); display: grid; place-items: end center; }
.dialog { width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: var(--paper); border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
.dialog h3 { margin: 0; font-family: var(--font-cn); font-weight: 400; font-size: 22px; }
.dialog p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--ink-soft); }
.dialog .row { display: flex; gap: 10px; }
.dialog .row .btn { flex: 1; }
.dialog ul { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.8; color: var(--ink-soft); }
.dialog ul b { color: var(--ink); }
.opt { display: grid; gap: 6px; }
.opt > span { font-size: 13px; font-weight: 700; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; font-size: 14px; border-left: 1.5px solid var(--ink); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }

@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-10deg); } 70% { transform: translateY(0) rotate(6deg); } 100% { transform: none; } }
@keyframes no { 0%,100% { transform: none; } 20% { transform: rotate(-12deg); } 45% { transform: rotate(10deg); } 70% { transform: rotate(-6deg); } }
@keyframes sway { from { transform: rotate(-9deg) translateY(0); } to { transform: rotate(9deg) translateY(-6px); } }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes caret { 50% { opacity: 0; } }
@keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes bump { 50% { transform: scale(1.25); } }
@keyframes pulse { to { transform: scale(1.08); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
#app[data-motion="off"] *, #app[data-motion="off"] *::after { animation: none !important; transition: none !important; }
#app[data-motion="off"] .sheet { transform: none; }
@media (max-height: 640px) {
  .key { height: 42px; font-size: 19px; }
  .combo { height: 30px; }
  .combo b { font-size: 26px; }
  .meaning { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .pp, .pp .eyes { animation: none; } }
</style>

<body>
<div id="app" data-stage="0">
  <!-- ================= home ================= -->
  <section id="scr-home" class="screen scroll grid-paper">
    <div class="wrap">
      <div class="hero">
        <div>
          <div class="eyebrow">CET-4 拼写挑战 · <span id="h-issue">第 1 期</span></div>
          <h1>嗨拼四级</h1>
          <p class="hook">毕业这么多年，<br>你还拼得出四级单词吗？</p>
        </div>

// ---------------- challenge link (?vs=seed-words-letters)
function parseVs() {

}

// ================================================================ audio

let voice = null;

  }
}
function flash(big, small) {

const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>';

// ================================================================ share card (canvas)
const CW = 1080, CH = 1350;
let mascotImg = null;
function loadMascot() {
  if (mascotImg) return Promise.resolve(mascotImg);
  return new Promise((res) => { const im = new Image(); im.onload = () => { mascotImg = im; res(im); }; im.onerror = () => res(null); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(MASCOT); });
}
async function ensureFonts(text) {
  try { await Promise.all([document.fonts.load('80px Bungee', 'HISPELL.VERCEL.APP0123456789/: '), document.fonts.load('80px "ZCOOL KuaiLe"', text)]); } catch (e) { /* fallback fonts */ }
}
function roundRect(cx, x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function stamp(cx, x, y, text, sub, color) {
  cx.save(); cx.translate(x, y); cx.rotate(-0.24); cx.globalAlpha = 0.88;
  cx.strokeStyle = color; cx.fillStyle = color;
  cx.lineWidth = 9; cx.beginPath(); cx.arc(0, 0, 118, 0, 7); cx.stroke();
  cx.lineWidth = 3; cx.beginPath(); cx.arc(0, 0, 100, 0, 7); cx.stroke();
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = `${text.length > 2 ? 60 : 76}px "ZCOOL KuaiLe", "PingFang SC", sans-serif`; cx.fillText(text, 0, -6);
  cx.font = '24px Bungee, sans-serif'; cx.fillText(sub, 0, 58);
  cx.restore();
}
async function drawCard(d) {
  await ensureFonts('嗨拼四级称号：' + [d.subtitle, d.bigLabel, d.bigUnit, d.stampText, d.title, d.stats, d.hook, ...d.subs].join(''));
  const img = await loadMascot();
  const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
  const cx = cv.getContext('2d');
  const CN = '"ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif';
  cx.fillStyle = '#FBFBF8'; cx.fillRect(0, 0, CW, CH);
  cx.strokeStyle = '#F7DCD8'; cx.lineWidth = 2;
  for (let x = 0; x <= CW; x += 54) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, CH); cx.stroke(); }
  for (let y = 0; y <= CH; y += 54) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(CW, y); cx.stroke(); }
  cx.strokeStyle = '#D6443A'; cx.lineWidth = 6; cx.strokeRect(36, 36, CW - 72, CH - 72);
  cx.lineWidth = 2; cx.setLineDash([10, 8]); cx.strokeRect(54, 54, CW - 108, CH - 108); cx.setLineDash([]);
  // header
  cx.textBaseline = 'alphabetic'; cx.textAlign = 'left'; cx.fillStyle = '#25232C';
  cx.font = `104px ${CN}`; cx.fillText('嗨拼四级', 96, 196);
  cx.fillStyle = '#D6443A'; cx.font = `44px ${CN}`; cx.fillText(d.subtitle, 100, 268);
  cx.textAlign = 'right'; cx.fillStyle = '#25232C'; cx.font = '40px Bungee, sans-serif'; cx.fillText(d.issueText, CW - 96, 150);
  cx.font = '30px Bungee, sans-serif'; cx.fillStyle = '#6C6875'; cx.fillText(d.dateText, CW - 96, 196);
  // score box
  cx.fillStyle = '#FFFFFF'; roundRect(cx, 96, 320, CW - 192, 420, 18); cx.fill();
  cx.strokeStyle = '#25232C'; cx.lineWidth = 5; roundRect(cx, 96, 320, CW - 192, 420, 18); cx.stroke();
  cx.textAlign = 'left'; cx.fillStyle = '#6C6875'; cx.font = `40px ${CN}`; cx.fillText(d.bigLabel, 140, 400);
  cx.fillStyle = '#D6443A'; cx.font = '230px Bungee, sans-serif'; cx.fillText(String(d.big), 128, 620);
  const bw = cx.measureText(String(d.big)).width;
  cx.fillStyle = '#25232C'; cx.font = d.bigUnit.startsWith('/') ? '54px Bungee, sans-serif' : `54px ${CN}`; cx.fillText(d.bigUnit, 140 + bw, 620);
  cx.font = `34px ${CN}`; cx.fillStyle = '#25232C';
  d.subs.forEach((s, i) => cx.fillText(s, 140 + i * 300, 700));
  stamp(cx, CW - 250, 470, d.stampText, d.stampSub, d.stampColor);
  // grid
  const cells = d.cells.length ? d.cells : ['#E8E3E0'];
  const per = Math.min(cells.length, 10), rows = Math.ceil(cells.length / per);
  const sz = rows > 2 ? 48 : rows > 1 ? 64 : 76, gap = rows > 2 ? 10 : 14, gw = per * sz + (per - 1) * gap, gx = (CW - gw) / 2;
  cells.forEach((c, i) => { const r = Math.floor(i / per), k = i % per; cx.fillStyle = c; roundRect(cx, gx + k * (sz + gap), 800 + r * (sz + gap), sz, sz, 10); cx.fill(); });
  const gy = 800 + rows * (sz + gap);
  // title + stats
  cx.textAlign = 'center'; cx.fillStyle = '#25232C';
  cx.font = `64px ${CN}`; cx.fillText('称号：' + d.title, CW / 2, gy + 80);
  cx.font = `34px ${CN}`; cx.fillStyle = '#6C6875'; cx.fillText(d.stats, CW / 2, gy + 136);
  // footer
  cx.textAlign = 'left'; cx.fillStyle = '#25232C';
  cx.font = `40px ${CN}`; cx.fillText(d.hook, 96, CH - 140);
  cx.fillStyle = '#D6443A'; cx.font = '36px Bungee, sans-serif'; cx.fillText('HI-SPELL.VERCEL.APP', 96, CH - 86);
  if (img) cx.drawImage(img, CW - 196, CH - 330, 120, 225);
  return cv;
}
const canvasBlob = (cv) => new Promise((res) => cv.toBlob(res, 'image/png'));

// ================================================================ results + sharing
const intentUrl = (text) => 'https://x.com/intent/post?text=' + encodeURIComponent(text);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('app').appendChild(t); setTimeout(() => t.remove(), 1800); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已复制，去粘贴吧'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制，去粘贴吧'); } catch (e2) { toast('复制失败，请手动选择文字'); }
    ta.remove();
  }
}
function wordRow(r) {
  const x = WORDS[WMAP.get(r.w)] || { m: '' };
  const w = [...r.w].map((ch, i) => (r.missPos && r.missPos.includes(i) ? `<mark>${esc(ch)}</mark>` : esc(ch))).join('');
  const tag = r.unfinished ? '<span class="r n">未作答</span>' : r.miss ? `<span class="r x">错 ${r.miss} 次</span>` : '<span class="r">一遍对</span>';
  return `<div class="witem"><span class="w">${w}</span><span class="m">${esc(x.m)}</span>${tag}</div>`;
}
function shareButtons() {
  return `<div class="share">
    <a class="btn dark" id="btn-x" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7 8 10.3h-6.2l-4.9-6.3L5.4 21H2.3l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>发到 X</a>
    <button class="btn" id="btn-img">保存图片</button>
    <button class="btn" id="btn-copy">复制文字</button>
  </div><p class="share-tip">带图更显眼：先保存成绩单，发帖时附上图片。</p>`;
}
async function mountShare(card, text, fileName) {
  $('btn-x').href = intentUrl(text);
  $('btn-copy').onclick = () => copyText(text);
  const imgEl = document.querySelector('#result-body .shot');
  const cv = await drawCard(card);
  const blob = await canvasBlob(cv);
  if (!blob || !imgEl.isConnected) return;
  const url = URL.createObjectURL(blob);
  imgEl.src = url; imgEl.alt = '成绩单图片';
  const file = new File([blob], fileName, { type: 'image/png' });
  let canFile = false; try { canFile = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { /* unsupported */ }
  const imgBtn = $('btn-img');
  imgBtn.textContent = canFile ? '分享图片' : '保存图片';
  imgBtn.onclick = async () => {
    if (canFile) { try { await navigator.share({ files: [file], text }); } catch (e) { /* cancelled */ } return; }
    const a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
    toast('也可以长按图片保存');

}

function showDailyResult(key) {
  const d = S.daily[key]; if (!d) return show('home');

function showSprintResult() {
  const words = G.results.length, lettersN = G.results.reduce((a, r) => a + r.len, 0);
  const firstN = G.results.filter((r) => !r.miss).length;
  const link = `${SITE}/?vs=${G.seed}-${words}-${lettersN}`;
  const vs = G.vs, seed = G.seed;
  const win = vs && (words > vs.words || (words === vs.words && lettersN > vs.letters));
  const title = sprintTitle(words), grid = G.results.map(cell).join('');
  const text = vs
    ? `嗨拼四级 60秒冲刺：对手拼了 ${vs.words} 个词，我拼出 ${words} 个${win ? ' 🏆' : ''}\n${grid}\n用同一组词挑战我 👉 ${link}`
    : `嗨拼四级 60秒冲刺：拼出 ${words} 个四级词（${lettersN} 个字母）\n${grid}\n用同一组词挑战我 👉 ${link}`;
  show('result');
  $('result-body').innerHTML = `
    <div class="res-head"><h2>60 秒冲刺</h2><span>${G.newBest ? '新纪录！' : S.sprintBest ? `最好 ${S.sprintBest.words} 词` : ''}</span></div>
    <img class="shot" alt="成绩单生成中">
    ${shareButtons()}
    <div class="verdict">${vs ? (win ? `赢了！对方 ${vs.words} 个词，你 ${words} 个。把链接甩回去。` : `对方 ${vs.words} 个词，你 ${words} 个。用同一组词再来一次？`) : '分享出去的链接带着这一组词，朋友打开就是同一套题。'}</div>
    <div class="section-title">拼过的词</div>

  $('result-foot').innerHTML = `<button class="btn" id="btn-home">回首页</button><button class="btn" id="btn-same">同组再来</button><button class="btn primary" id="btn-again">换一组</button>`;
  $('btn-home').onclick = () => { G = null; show('home'); };
  $('btn-same').onclick = () => startGame('sprint', { seed, vs });
  $('btn-again').onclick = () => startGame('sprint');
  $('result-body').parentElement.scrollTop = 0;
  const now = new Date();
  mountShare({
    subtitle: vs ? '60 秒冲刺 · 挑战赛' : '60 秒冲刺', issueText: '60 SEC', dateText: `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}`,
    bigLabel: '60 秒拼出', big: words, bigUnit: ' 个词', subs: [`字母 ${lettersN}`, `一遍拼对 ${firstN}`],
    stampText: vs ? (win ? '胜' : '再战') : title.slice(0, 2), stampSub: vs ? `VS ${vs.words}` : 'SPEED', stampColor: vs && !win ? '#6C6875' : '#D6443A',
    cells: G.results.map(cellColor).slice(0, 30), title, stats: `最高连击 ${G.maxCombo} · 越往后词越难`,
    hook: '60 秒，你能拼出几个四级单词？',
  }, text, `hi-spell-sprint-${words}.png`);
}

// ================================================================ dialogs
function openDialog(html) { $('dialog').innerHTML = html; $('overlay').hidden = false; $('dialog').querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeDialog)); const f = $('dialog').querySelector('button'); if (f) f.focus(); }
function closeDialog() { $('overlay').hidden = true; $('dialog').innerHTML = ''; }
$('overlay').addEventListener('click', (e) => { if (e.target === $('overlay') && !$('q-no')) closeDialog(); });
const seg = (id, label, opts, val) => `<div class="opt"><span>${label}</span><div class="seg" id="${id}">${opts.map(([v, t]) => `<button data-v="${v}" aria-pressed="${String(v) === String(val)}">${t}</button>`).join('')}</div></div>`;
function settingsDialog() {
  const s = S.settings;
  openDialog(`
    <h3>声音和动效</h3>
    ${seg('o-speak', '出题时自动发音', [[1, '开'], [0, '关']], s.autoSpeak ? 1 : 0)}
    ${seg('o-music', '背景音乐', [[1, '开'], [0, '关']], s.music ? 1 : 0)}
    ${seg('o-sfx', '音效', [[1, '开'], [0, '关']], s.sfx ? 1 : 0)}
    ${seg('o-motion', '动效强度', [['strong', '强'], ['low', '弱'], ['off', '关']], s.motion)}
    <div class="row"><button class="btn primary" data-close>完成</button></div>`);
  const bind = (id, fn) => $(id).querySelectorAll('button').forEach((b) => (b.onclick = () => { fn(b.dataset.v); save(); applyAudio(); applyMotion(); settingsDialog(); }));
  bind('o-speak', (v) => (s.autoSpeak = v === '1'));
  bind('o-music', (v) => (s.music = v === '1'));
  bind('o-sfx', (v) => (s.sfx = v === '1'));
  bind('o-motion', (v) => (s.motion = v));
}
function rulesDialog() {
  openDialog(`
    <h3>玩法和计分</h3>
    <ul>
      <li>听发音、看中文释义，<b>一个字母一个字母</b>地拼，每个字母当场判对错。</li>
      <li>拼错不会结束，换个字母继续。同一格错 2 次会慢速重读并给词组提示，错 3 次显示浅色字母。</li>
      <li><b>今日挑战</b>：每天 10 词，所有人相同，每天一次。每词 71 分：准确 56（一遍对 56 / 错过 34 / 用了浅色提示 14）+ 速度 15。满分 710，<b>425 过线</b>。中途离开会保存进度，离开期间不计时。</li>
      <li>格子：🟩 一遍拼对　🟨 错过但自己拼出　🟥 用了浅色提示　⬜ 没作答</li>
      <li><b>60 秒冲刺</b>：不限次数，越往后越难。分享链接带着同一组词，朋友打开就是同一套题。</li>
      <li>电脑可以直接打字，回车或空格重听，Esc 暂停。</li>

}
function quitDialog() {
  if (!G || G.ended) return;
  const wasOpen = G.inputOpen; G.inputOpen = false; G.pausedAt = performance.now();
  const daily = G.mode === 'daily';
  openDialog(`<h3>${daily ? '先离开一下？' : '放弃这次冲刺？'}</h3><p>${daily ? '已答的题会保存，回首页可以继续答。离开期间不计时。' : '这次冲刺不会计入成绩。'}</p>
    <div class="row"><button class="btn ghost" id="q-no">继续</button><button class="btn primary" id="q-yes">${daily ? '回首页' : '放弃'}</button></div>`);
  $('q-no').onclick = () => { const d = performance.now() - G.pausedAt; G.comboDeadline += d; if (daily) G.t0 += d; else if (G.tEnd) G.tEnd += d; G.inputOpen = wasOpen; closeDialog(); };
  $('q-yes').onclick = () => {
    closeDialog();
    if (daily) { const d = S.daily[G.key]; d.elapsed = Math.round(G.pausedAt - G.t0); save(); }
    G.ended = true; G = null; show('home');
  };
}
function applyMotion() { $('app').dataset.motion = S.settings.motion; }

// ================================================================ keyboard
function buildKeyboard() {
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l5 6M17 9l-5 6"/></svg>';
  $('kb').innerHTML = rows.map((r, i) => `<div class="kb-row">${i === 2 ? `<button class="key wide" data-k="speak" aria-label="重听发音">${ICON_SOUND}</button>` : ''}${[...r].map((c) => `<button class="key" data-k="${c}">${c}</button>`).join('')}${i === 2 ? `<button class="key wide" data-k="back" aria-label="删除">${back}</button>` : ''}</div>`).join('');
  $('kb').addEventListener('pointerdown', (e) => { const b = e.target.closest('.key'); if (!b) return; e.preventDefault(); press(b.dataset.k); });
}
function press(k) {
  const b = document.querySelector(`.key[data-k="${k}"]`);
  if (b) { b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 90); }
  if (k === 'back') onBack();
  else if (k === 'speak') { if (G && G.cur) speak(G.cur.w); }
  else onKey(k);
}
document.addEventListener('keydown', (e) => {
  if (!$('overlay').hidden) { if (e.key === 'Escape') { const no = $('q-no'); if (no) no.click(); else closeDialog(); } return; }
  if ($('scr-play').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[a-z]$/i.test(e.key)) { e.preventDefault(); press(e.key.toLowerCase()); }
  else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('speak'); }
  else if (e.key === 'Escape') quitDialog();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G && !G.ended && !$('scr-play').hidden && $('overlay').hidden) quitDialog();
  if (!A.ctx) return;
  if (document.hidden) A.ctx.suspend(); else if (!$('scr-play').hidden) A.ctx.resume();
});

// ================================================================ boot
function boot() {
  FX.init(); buildKeyboard(); applyMotion();
  $('home-mascot').innerHTML = MASCOT; $('play-mascot').innerHTML = MASCOT;
  $('btn-sprint').onclick = () => startGame('sprint');
  $('btn-rules').onclick = rulesDialog;
  $('btn-settings').onclick = settingsDialog;
  $('btn-quit').onclick = quitDialog;
  $('btn-speak').onclick = () => { if (G && G.cur) speak(G.cur.w); };
  $('btn-mute').onclick = () => { S.settings.muted = !S.settings.muted; save(); applyAudio(); updateMute(); };
  addEventListener('resize', () => { if (G && G.cur && !$('scr-play').hidden) renderWord(); });
  if (!WORDS.length) { $('daily-body').textContent = '词表没有加载成功，请刷新页面。'; return; }
  show('home');
}
boot();
})();
